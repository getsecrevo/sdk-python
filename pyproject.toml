[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secrevo-sdk"
version = "0.4.0"
description = "Python SDK for Secrevo — pull secrets from your Secrevo workspace and hand them to OpenAI, Anthropic, Stripe, AWS, or GitHub without ever materializing them in your code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "cryptography>=42",
  "platformdirs>=4",
  "portalocker>=2.10",
]
cache = [
  "cryptography>=42",
  "platformdirs>=4",
  "portalocker>=2.10",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
stripe = ["stripe>=8"]
aws = ["boto3>=1.34"]
github = ["PyGithub>=2.1"]
all = [
  "openai>=1.0",
  "anthropic>=0.30",
  "stripe>=8",
  "boto3>=1.34",
  "PyGithub>=2.1",
  "cryptography>=42",
  "platformdirs>=4",
  "portalocker>=2.10",
]

[project.urls]
Homepage = "https://secrevo.com"
Documentation = "https://github.com/getsecrevo/sdk-python"
Source = "https://github.com/getsecrevo/sdk-python"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secrevo_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
