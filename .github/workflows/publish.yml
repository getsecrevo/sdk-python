name: publish

# Publish secrevo-sdk to PyPI when a version tag is pushed to main.
# Authentication uses PyPI Trusted Publishing (OIDC): no API tokens or
# secrets are stored anywhere — the GitHub Actions runner exchanges its
# OIDC ID-token for a short-lived PyPI upload token at runtime.
#
# Required one-time setup on pypi.org (done outside this repo):
#   1. Maintainer logs into pypi.org.
#   2. https://pypi.org/manage/account/publishing/ → "Add a new pending
#      publisher" with:
#        - PyPI Project Name: secrevo-sdk
#        - Owner:             getsecrevo
#        - Repository name:   sdk-python
#        - Workflow filename: publish.yml
#        - Environment name:  (empty)
#
# Trigger: tag matching `v*` pushed to any branch. To cut a release:
#     git tag -a v0.3.0 -m 'secrevo-sdk 0.3.0'
#     git push origin v0.3.0
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build sdist + wheel, publish to PyPI
    runs-on: ubuntu-latest
    # id-token: write is the OIDC permission that lets the runner mint
    # a token PyPI will accept; contents: read is enough since we only
    # check out the tag.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Confirm dist artifacts exist
        run: ls -la dist/

      - name: Publish to PyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
