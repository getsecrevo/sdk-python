name: pr

# Runs on every pull request targeting main + push to main. Single
# Python version on PRs to keep the GitHub Actions quota in check;
# the full 3.10-3.13 compatibility matrix runs on:
#   - publish.yml (every release tag, before sdist + wheel upload)
#   - cross-version.yml (weekly + workflow_dispatch)
#
# 3.12 is the canonical PR version: middle of the supported range,
# fastest install on linux runners.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-python-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: pytest
        run: pytest -q
